<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>數學邏輯訓練站</title></head><body style="font-family:system-ui;text-align:center;padding:2em;color:#24334a"><p>數學邏輯訓練站載入中…</p><script>
(async()=>{try{const r=await fetch('./app.gz.b64');if(!r.ok)throw Error('載入資料失敗');const b=await r.text();const raw=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('目前瀏覽器不支援壓縮載入，請更新瀏覽器');const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const patched=html.includes('</body>')?html.replace('</body>','<script type="module" src="./zhuyin.js"><\/script></body>'):html;document.open();document.write(patched);document.close()}catch(e){document.body.innerHTML='<h2>網站載入失敗</h2><p>'+e.message+'</p>'}})();
</script></body></html>
